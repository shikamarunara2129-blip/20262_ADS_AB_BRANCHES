<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenar Números</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Ordenar Números</h1>
    <div class="container">
        <label for="quantidade">Quantos números deseja inserir?</label>
        <input type="number" id="quantidade" min="1" placeholder="Digite N">
        <button onclick="inserirNumeros()">Inserir Números</button>
    </div>

    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
